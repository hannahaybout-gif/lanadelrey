<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="planner"><meta name="theme-color" content="#f8e4e8"><title>my dashboard ♡</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Quicksand:wght@400;600&family=Playfair+Display:wght@500;700&family=Dancing+Script:wght@500;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffafa;--card:#fff;--ink:#3a2f31;--soft:#9a8589;--pink:#f8e4e8;--rose:#d98fa0;--line:#efd5da;--dot:#cdb0b6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241d1f;--card:#2f2629;--ink:#f6e8eb;--soft:#bfa4ab;--pink:#3d2c31;--line:#4a3940;--dot:#6a5158}}
:root[data-theme="dark"]{--bg:#241d1f;--card:#2f2629;--ink:#f6e8eb;--soft:#bfa4ab;--pink:#3d2c31;--line:#4a3940;--dot:#6a5158}
*{box-sizing:border-box}
:root{--hf:'Cormorant Garamond',Georgia,serif;--bf:Quicksand,system-ui,sans-serif}
[data-cs=solid] .card{border-style:solid}[data-cs=soft] .card{border-color:transparent;background:var(--pink)}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--bf);-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--hf);margin:0;font-weight:700}
h1{font-size:46px}h2{font-size:30px;margin-bottom:10px}h3{font-size:21px;margin-bottom:6px}
#app{display:flex;min-height:100vh}
nav{width:190px;flex:none;padding:18px 12px 80px;border-right:1px dotted var(--dot);position:sticky;top:0;height:100vh;overflow:auto}
nav b{font:700 22px var(--hf);display:block;padding:4px 10px 12px}
nav a{display:block;padding:9px 12px;border-radius:14px;color:var(--ink);cursor:pointer;font-weight:600;margin-bottom:2px}
nav a.on{background:var(--pink);color:var(--rose)}
main{flex:1;min-width:0;padding:0 0 100px}
.pad{padding:22px 28px}
.cover{height:170px;background:var(--pink) radial-gradient(var(--dot) 2px,transparent 2.5px) 0 0/22px 22px;background-size:22px 22px;background-position:center;cursor:pointer;position:relative}
.cover.img{background-size:cover}
.avatar{width:120px;height:120px;border-radius:50%;margin:-60px 0 0 40px;border:4px solid var(--bg);background:var(--pink) center/cover;position:relative;cursor:pointer;display:grid;place-items:center;font-size:44px}
.quote{border-left:4px solid var(--rose);background:var(--pink);padding:10px 16px;font:italic 500 22px var(--hf);margin:14px 0 18px;outline:0;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1.5px dotted var(--rose);border-radius:24px;padding:16px 18px}
input,textarea,select,button{font:inherit;color:var(--ink)}
input,textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:9px 12px;width:100%;outline:0}
input:focus,textarea:focus{border-color:var(--rose)}
textarea{resize:vertical;min-height:110px}
.btn{background:var(--rose);color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--pink);color:var(--rose)}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.item{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dotted var(--line)}
.item.d span{text-decoration:line-through;color:var(--soft)}
.item span{flex:1;min-width:0;overflow-wrap:anywhere}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--rose);background:none;cursor:pointer;flex:none;color:#fff;font-size:13px;padding:0}
.d .chk{background:var(--rose)}
.x{background:none;border:0;color:var(--soft);cursor:pointer;font-size:20px;padding:0 4px}
.soft{color:var(--soft);font-size:14px}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.today{background:var(--pink)}
.mood{columns:3 180px;gap:12px}
.mood div{position:relative;break-inside:avoid;margin-bottom:12px}
.mood img{width:100%;border-radius:18px;display:block;border:3px solid var(--card)}
.mood .x{position:absolute;top:6px;right:6px;background:var(--card);border-radius:50%;width:28px;height:28px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.big{font:700 64px var(--hf);text-align:center;color:var(--rose)}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px dotted var(--rose);display:flex;gap:10px;align-items:center;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
#bar .nm{font:italic 500 18px 'Cormorant Garamond',serif;min-width:90px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar input[type=range]{padding:0;border:0;background:none;accent-color:var(--rose)}
.pb{background:none;border:0;font-size:22px;color:var(--rose);cursor:pointer}
.notes{display:grid;grid-template-columns:230px 1fr;gap:16px}
@media (max-width:760px){#app{display:block}nav{width:auto;height:auto;position:sticky;top:0;z-index:4;background:var(--bg);display:flex;overflow-x:auto;padding:8px;border:0;border-bottom:1px dotted var(--dot)}nav b{display:none}nav a{white-space:nowrap}.pad{padding:16px}h1{font-size:36px}.notes{grid-template-columns:1fr}.avatar{margin-left:20px}}
.ev{background:color-mix(in srgb,var(--c) 22%,var(--card));border-left:4px solid var(--c);border-radius:12px;padding:5px 8px;margin-bottom:5px;font-size:13px;line-height:1.3;cursor:pointer;overflow:hidden}
.ev.d{opacity:.5;text-decoration:line-through}.ev.rt{border-left-style:dashed}
.wh{text-align:center;padding:6px 4px;border-radius:14px}.wh.today{background:var(--pink);color:var(--rose)}
.tl{position:relative;border-left:1px dotted var(--line);overflow:hidden}.tl .ev{position:absolute;margin:0;font-size:12px;z-index:1}
.hr{position:absolute;left:0;right:0;border-top:1px dotted var(--line)}.wscroll{overflow-x:auto}
</style></head>
<body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="bar"><button class="pb" onclick="step(-1)">⏮</button><button class="pb" id="pp" onclick="toggle()">▶</button><button class="pb" onclick="step(1)">⏭</button><span class="nm" id="nm">add songs in music ♡</span><input type="range" id="sk" min="0" max="100" value="0" style="flex:1"></div>
<audio id="au"></audio>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={quote:'soft girl era ♡',avatar:'',cover:'',todos:[],diary:[],sched:{},agenda:[],subjects:[],notes:[],wish:[],boards:[{id:1,n:'my vibe',imgs:[]}],songs:[],habits:[],photos:[],cv:{},pn:{},order:[],hide:{},th:{},app:'my planner ♡',title:'dashboard ♡',hf:'Cormorant Garamond',bf:'Quicksand',mode:'auto',cs:'dotted',evs:[],wk:{},wset:{},cats:[{id:1,n:'school',e:'📚',c:'#a78bcf'},{id:2,n:'self-care',e:'🛁',c:'#d98fa0'},{id:3,n:'social',e:'🥂',c:'#d4a94a'},{id:4,n:'work',e:'💼',c:'#6fa3d6'},{id:5,n:'fitness',e:'🏃',c:'#7fa88a'}]};
try{Object.assign(S,JSON.parse(localStorage.getItem('cq')||'{}'))}catch(x){}
const save=()=>{try{localStorage.setItem('cq',JSON.stringify(S))}catch(x){alert('Storage is full. Remove a few images to free space.')}};
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),T=iso(new Date());
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],TD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()];
const DEF={home:['🎀','dashboard'],week:['🌼','my week'],habit:['🌷','habits'],diary:['📖','diary'],sched:['🌸','weekly routine'],todo:['🍓','to-do'],agenda:['🗓','agenda'],study:['📚','study'],notes:['🤍','notes'],mood:['🖼','mood boards'],wish:['🛍','wishlist'],music:['🎧','music'],custom:['⚙️','customize']};
const lab=k=>{const p=S.pn[k]||[];return [p[0]??DEF[k][0],p[1]??DEF[k][1]]};
const allK=()=>[...S.order.filter(k=>DEF[k]),...Object.keys(DEF).filter(k=>!S.order.includes(k))];
const pages=()=>allK().filter(k=>k=='custom'||!S.hide[k]);
let pg='home',bd=0,nid=0;
/* storage for songs */
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('cqs',1);q.onupgradeneeded=()=>q.result.createObjectStore('a');q.onsuccess=()=>r(q.result);q.onerror=j});
const idbPut=async(k,v)=>{try{(await idb()).transaction('a','readwrite').objectStore('a').put(v,k)}catch(x){}};
const idbGet=async k=>{try{const d=await idb();return await new Promise(r=>{const q=d.transaction('a').objectStore('a').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(x){}};
const img=(f,w,t)=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,w/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL(t||'image/jpeg',.72))};i.src=URL.createObjectURL(f)});
/* generic helpers */
const draw=()=>{$('#main').innerHTML=(pg=='home'?'':banner())+P[pg]();const h=$('#main h2');if(h)h.textContent=lab(pg).join(' ')};
const go=p=>{if(p)pg=p;nav();draw();scrollTo(0,0)};
const re=()=>{const y=scrollY;draw();scrollTo(0,y)};
const nav=()=>$('#nav').innerHTML=`<b>${e(S.app)}</b>`+pages().map(k=>`<a class="${k==pg?'on':''}" onclick="go('${k}')">${lab(k).join(' ')}</a>`).join('');
const val=id=>($('#'+id)?.value||'').trim();
const item=(k,o,sub)=>`<div class="item ${o.d?'d':''}"><button class="chk" onclick="tg('${k}',${o.id})">${o.d?'✓':''}</button><span>${e(o.t)}${sub?`<br><small class="soft">${sub}</small>`:''}</span><button class="x" onclick="rm('${k}',${o.id})">×</button></div>`;
const tg=(k,id)=>{const o=S[k].find(x=>x.id==id);o.d=!o.d;save();re()};
const rm=(k,id)=>{S[k]=S[k].filter(x=>x.id!=id);save();re()};
const addTo=(k,o,ids)=>{if(!o.t)return;o.id=Date.now();o.d=0;S[k].push(o);save();re()};
const addTodo=()=>addTo('todos',{t:val('ti')});
const addAg=()=>addTo('agenda',{t:val('at'),w:val('ad')||T});
const addWish=()=>addTo('wish',{t:val('wt'),p:val('wp'),u:val('wu')});
const pickImg=(key,w,t)=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(i.files[0]){S[key]=await img(i.files[0],w,t);save();re()}};i.click()};
/* pages */
const todoCard=n=>`<div class="card"><h3>today’s to-do</h3><div class="row"><input id="ti" placeholder="add something sweet…" onkeydown="event.key=='Enter'&&addTodo()"><button class="btn" onclick="addTodo()">add</button></div>${S.todos.filter(t=>n||!t.d).slice(0,n?99:6).map(t=>item('todos',t)).join('')||'<p class="soft">nothing yet, a clean slate ♡</p>'}${n?`<button class="btn ghost" onclick="S.todos=S.todos.filter(t=>!t.d);save();re()">clear done</button>`:''}</div>`;
const P={
home(){const up=S.agenda.filter(a=>!a.d&&a.w>=T).sort((a,b)=>a.w>b.w?1:-1).slice(0,4),ts=(S.sched[TD]||[]).sort((a,b)=>a.time>b.time?1:-1);
return`<div class="cover ${S.cover?'img':''}" style="${S.cover?`background-image:url(${S.cover})`:''}" onclick="pickImg('cover',1400)" title="tap to change cover"></div>
<div class="pad"><div class="avatar" style="${S.avatar?`background-image:url(${S.avatar})`:''}" onclick="pickImg('avatar',300,'image/png')">${S.avatar?'':'🎀'}</div>
<h1 style="margin-top:12px" contenteditable="true" onblur="S.title=this.textContent;save()">${e(S.title)}</h1><div class="quote" contenteditable="true" onblur="S.quote=this.textContent;save()">${e(S.quote)}</div>
<div class="grid">${todoCard(0)}
<div class="card"><h3>${TD} schedule</h3>${ts.map(s=>`<div class="item"><span><b>${e(s.time)}</b> ${e(s.t)}</span></div>`).join('')||'<p class="soft">free day. add things in schedule ♡</p>'}</div>
<div class="card"><h3>coming up</h3>${up.map(a=>item('agenda',a,a.w)).join('')||'<p class="soft">nothing planned yet</p>'}</div>
<div class="card"><h3>habits today</h3>${S.habits.slice(0,6).map(h=>`<div class="item ${h.days[T]?'d':''}"><button class="chk" onclick="hg(${h.id},-1)">${h.days[T]?'✓':''}</button><span>${e(h.e)} ${e(h.n)}</span></div>`).join('')||'<p class="soft">add habits on the habits page ♡</p>'}</div><div class="card"><h3>my photos</h3><div class="mood" style="columns:2 110px">${S.photos.map((s,i)=>`<div><img src="${s}"><button class="x" onclick="S.photos.splice(${i},1);save();re()">×</button></div>`).join('')}</div><button class="btn ghost" onclick="addPh()">+ add photos</button></div><div class="card"><h3>dear diary</h3><p class="soft">how was today?</p><button class="btn" onclick="go('diary')">write an entry</button></div></div>
<p class="soft" style="margin-top:20px">tap the cover or the circle to add your own pictures. tap the quote to rewrite it.</p></div>`},
todo:()=>`<div class="pad"><h2>to-do 🍓</h2>${todoCard(1)}</div>`,
diary(){const m=['🌸','🥰','😌','🥲','😤','😴'];return`<div class="pad"><h2>diary 📖</h2><div class="card"><div class="row"><input type="date" id="dd" value="${T}"><select id="dm" style="width:90px">${m.map(x=>`<option>${x}</option>`).join('')}</select></div><textarea id="dt" placeholder="dear diary…"></textarea><div class="row"><button class="btn" onclick="addDiary()">save entry</button></div></div><div style="height:16px"></div>${[...S.diary].reverse().sort((a,b)=>a.w<b.w?1:-1).map(d=>`<div class="card" style="margin-bottom:12px"><div class="row"><h3 style="flex:1">${d.m} ${d.w}</h3><button class="x" onclick="rm('diary',${d.id})">×</button></div><div contenteditable="true" style="outline:0;white-space:pre-wrap" onblur="S.diary.find(x=>x.id==${d.id}).t=this.innerText;save()">${e(d.t)}</div></div>`).join('')}</div>`},
sched:()=>`<div class="pad"><h2>weekly schedule 🌸</h2><p class="soft">repeats every week. tap × to remove.</p><div class="week">${DAYS.map(d=>`<div class="card ${d==TD?'today':''}"><h3>${d}</h3>${(S.sched[d]||[]).sort((a,b)=>a.time>b.time?1:-1).map(s=>`<div class="item"><span><b>${e(s.time)}</b> ${e(s.t)}</span><button class="x" onclick="rmS('${d}',${s.id})">×</button></div>`).join('')}<div class="row" style="flex-wrap:wrap"><input type="time" id="tm${d}"><input id="tx${d}" placeholder="what?"><button class="btn" onclick="addS('${d}')">+</button></div></div>`).join('')}</div></div>`,
agenda:()=>`<div class="pad"><h2>agenda 🗓</h2><div class="card"><div class="row"><input type="date" id="ad" value="${T}" style="width:170px"><input id="at" placeholder="event or deadline" onkeydown="event.key=='Enter'&&addAg()"><button class="btn" onclick="addAg()">add</button></div>${[...S.agenda].sort((a,b)=>a.w>b.w?1:-1).map(a=>item('agenda',a,a.w==T?'today':a.w)).join('')||'<p class="soft">your agenda is empty ♡</p>'}</div></div>`,
study:()=>`<div class="pad"><h2>study 📚</h2><div class="grid"><div class="card"><h3>focus timer</h3><div class="big" id="pm">${fmt()}</div><div class="row" style="justify-content:center"><button class="btn" onclick="pmGo()">start / pause</button><button class="btn ghost" onclick="pmSet(1500)">25</button><button class="btn ghost" onclick="pmSet(300)">5</button></div></div>
<div class="card"><h3>new subject</h3><div class="row"><input id="sn" placeholder="e.g. biology" onkeydown="event.key=='Enter'&&addSub()"><button class="btn" onclick="addSub()">add</button></div></div></div><div style="height:16px"></div><div class="grid">${S.subjects.map(s=>`<div class="card"><div class="row"><h3 style="flex:1">${e(s.n)}</h3><button class="x" onclick="rm('subjects',${s.id})">×</button></div>${s.tasks.map(t=>`<div class="item ${t.d?'d':''}"><button class="chk" onclick="stg(${s.id},${t.id})">${t.d?'✓':''}</button><span>${e(t.t)}</span><button class="x" onclick="srm(${s.id},${t.id})">×</button></div>`).join('')}<div class="row"><input id="st${s.id}" placeholder="add task" onkeydown="event.key=='Enter'&&addSt(${s.id})"><button class="btn" onclick="addSt(${s.id})">+</button></div></div>`).join('')}</div></div>`,
notes(){const n=S.notes.find(x=>x.id==nid);return`<div class="pad"><h2>notes 🤍</h2><div class="notes"><div class="card"><button class="btn" onclick="newNote()">+ new note</button><div id="nl">${nl()}</div></div>${n?`<div class="card"><input id="nt" value="${e(n.t)}" placeholder="title" oninput="upN()" style="font:700 24px 'Cormorant Garamond',serif"><textarea id="nb" style="min-height:360px;margin-top:8px" oninput="upN()" placeholder="write here…">${e(n.b)}</textarea><button class="btn ghost" onclick="rm('notes',${n.id});nid=0;re()">delete note</button></div>`:'<div class="card soft">pick or make a note ♡</div>'}</div></div>`},
mood(){const b=S.boards[bd]||S.boards[0];return`<div class="pad"><h2>mood boards 🖼</h2><div class="tabs">${S.boards.map((x,i)=>`<button class="btn ${i==bd?'':'ghost'}" onclick="bd=${i};re()">${e(x.n)}</button>`).join('')}<button class="btn ghost" onclick="newBoard()">+ board</button><button class="btn ghost" onclick="addImgs()">+ photos</button>${S.boards.length>1?`<button class="btn ghost" onclick="S.boards.splice(bd,1);bd=0;save();re()">delete board</button>`:''}</div><div class="mood">${b.imgs.map((s,i)=>`<div><img src="${s}"><button class="x" onclick="S.boards[bd].imgs.splice(${i},1);save();re()">×</button></div>`).join('')||'<p class="soft">tap + photos to start pinning ♡</p>'}</div></div>`},
wish:()=>`<div class="pad"><h2>wishlist 🛍</h2><div class="card"><div class="row" style="flex-wrap:wrap"><input id="wt" placeholder="item" style="flex:2"><input id="wp" placeholder="price" style="flex:1"><input id="wu" placeholder="link (optional)" style="flex:2"><button class="btn" onclick="addWish()">add</button></div>${S.wish.map(w=>item('wish',w,(w.p?e(w.p)+' ':'')+(w.u?`<a href="${e(w.u)}" target="_blank" rel="noopener" style="color:var(--rose)">link</a>`:''))).join('')||'<p class="soft">what are we wishing for?</p>'}</div></div>`,
music:()=>`<div class="pad"><h2>music 🎧</h2><div class="card"><div class="row"><button class="btn" onclick="addSong()">+ upload songs</button><button class="btn ghost" onclick="addLink()">+ add a link</button></div><p class="soft">songs stay saved on this device. the player at the bottom plays across every page.</p>${S.songs.map((s,i)=>`<div class="item ${cur==i?'d':''}"><button class="chk" onclick="play(${i})">▶</button><span>${e(s.n)}</span><button class="x" onclick="S.songs.splice(${i},1);save();re()">×</button></div>`).join('')||'<p class="soft">no songs yet ♡</p>'}</div></div>`
};
/* actions */
const addDiary=()=>{const t=val('dt');if(!t)return;S.diary.push({id:Date.now(),w:val('dd')||T,m:$('#dm').value,t});save();re()};
const addS=d=>{const t=val('tx'+d);if(!t)return;(S.sched[d]=S.sched[d]||[]).push({id:Date.now(),time:val('tm'+d)||'00:00',t});save();re()};
const rmS=(d,id)=>{S.sched[d]=S.sched[d].filter(x=>x.id!=id);save();re()};
const addSub=()=>{const n=val('sn');if(!n)return;S.subjects.push({id:Date.now(),n,tasks:[]});save();re()};
const addSt=id=>{const t=val('st'+id);if(!t)return;S.subjects.find(s=>s.id==id).tasks.push({id:Date.now(),t,d:0});save();re()};
const stg=(s,t)=>{const o=S.subjects.find(x=>x.id==s).tasks.find(x=>x.id==t);o.d=!o.d;save();re()};
const srm=(s,t)=>{const o=S.subjects.find(x=>x.id==s);o.tasks=o.tasks.filter(x=>x.id!=t);save();re()};
let pm={l:1500,iv:0};const fmt=()=>String(pm.l/60|0).padStart(2,'0')+':'+String(pm.l%60).padStart(2,'0');
const pmSet=s=>{clearInterval(pm.iv);pm.iv=0;pm.l=s;re()};
const pmGo=()=>{if(pm.iv){clearInterval(pm.iv);pm.iv=0;return}pm.iv=setInterval(()=>{pm.l--;if($('#pm'))$('#pm').textContent=fmt();if(pm.l<=0){clearInterval(pm.iv);pm.iv=0;pm.l=1500;alert('time for a break ♡')}},1000)};
const nl=()=>S.notes.map(n=>`<div class="item"><span style="cursor:pointer;${n.id==nid?'color:var(--rose);font-weight:600':''}" onclick="nid=${n.id};re()">${e(n.t)||'untitled'}</span></div>`).join('');
const newNote=()=>{const n={id:Date.now(),t:'',b:''};S.notes.unshift(n);nid=n.id;save();re()};
const upN=()=>{const n=S.notes.find(x=>x.id==nid);n.t=$('#nt').value;n.b=$('#nb').value;save();$('#nl').innerHTML=nl()};
const newBoard=()=>{const n=prompt('board name?');if(n){S.boards.push({id:Date.now(),n,imgs:[]});bd=S.boards.length-1;save();re()}};
const addImgs=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=async()=>{for(const f of i.files)S.boards[bd].imgs.push(await img(f,520));save();re()};i.click()};
/* music */
const au=$('#au');let cur=-1;
const addSong=()=>{const i=document.createElement('input');i.type='file';i.accept='audio/*';i.multiple=true;i.onchange=async()=>{for(const f of i.files){const id=Date.now()+Math.random();await idbPut(id,f);S.songs.push({id,n:f.name.replace(/\.[^.]+$/,'')})}save();re()};i.click()};
const addLink=()=>{const u=prompt('paste a direct audio link (mp3)');if(u){S.songs.push({id:Date.now(),n:prompt('song name?')||'my song',u});save();re()}};
const play=async i=>{const s=S.songs[i];if(!s)return;let src=s.u;if(!src){const b=await idbGet(s.id);if(!b)return alert('song file not found on this device');src=URL.createObjectURL(b)}cur=i;au.src=src;au.play();$('#nm').textContent=s.n;if(pg=='music')re()};
const toggle=()=>au.src?(au.paused?au.play():au.pause()):play(0);

au.onplay=()=>$('#pp').textContent='⏸';au.onpause=()=>$('#pp').textContent='▶';au.onended=()=>step(1);
au.ontimeupdate=()=>{if(au.duration)$('#sk').value=au.currentTime/au.duration*100};
$('#sk').oninput=ev=>{if(au.duration)au.currentTime=ev.target.value/100*au.duration};
/* banners, photos, theme */
const banner=()=>{const c=S.cv[pg];return `<div class='cover ${c?'img':''}' style='height:120px;${c?`background-image:url(${c})`:''}' onclick='pickCv()' title='tap to change banner'></div>`};
const pickCv=()=>{const k=pg,i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(i.files[0]){S.cv[k]=await img(i.files[0],1400);save();re()}};i.click()};
const addPh=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=async()=>{for(const f of i.files)S.photos.push(await img(f,500));save();re()};i.click()};
const PRE=['#d98fa0','#a78bcf','#7fa88a','#d4a94a','#6fa3d6','#c0394d'];
const FONTS={'Cormorant Garamond':"'Cormorant Garamond',Georgia,serif",'Playfair Display':"'Playfair Display',Georgia,serif",'Dancing Script':"'Dancing Script',cursive",'Lora':"Lora,Georgia,serif",'Quicksand':"Quicksand,system-ui,sans-serif"};
const applyTheme=()=>{const r=document.documentElement,s=r.style,a=S.th&&S.th.a;if(a){s.setProperty('--rose',a);s.setProperty('--pink','color-mix(in srgb,'+a+' 16%,var(--card))');s.setProperty('--line','color-mix(in srgb,'+a+' 30%,var(--card))');s.setProperty('--dot','color-mix(in srgb,'+a+' 55%,var(--card))')}else['--rose','--pink','--line','--dot'].forEach(k=>s.removeProperty(k));s.setProperty('--hf',FONTS[S.hf]);s.setProperty('--bf',FONTS[S.bf]);r.dataset.cs=S.cs;if(S.mode=='auto')delete r.dataset.theme;else r.dataset.theme=S.mode};
const setA=i=>{S.th={a:PRE[i]};save();applyTheme()};
const sel=(k,o)=>`<select onchange='S.${k}=this.value;save();applyTheme()'>${o.map(f=>`<option ${S[k]==f?'selected':''}>${f}</option>`).join('')}</select>`;
const setPn=(n,i,v)=>{const k=allK()[n];S.pn[k]=[...lab(k)];S.pn[k][i]=v;save();nav()};
const mv=(n,d)=>{const a=allK(),m=n+d;if(m<0||m>=a.length)return;[a[n],a[m]]=[a[m],a[n]];S.order=a;save();nav();re()};
const hd=n=>{const k=allK()[n];S.hide[k]=!S.hide[k];save();nav()};
P.custom=()=>`<div class='pad'><h2>customize</h2><div class='grid'><div class='card'><h3>names</h3><p class='soft'>app name</p><input value="${e(S.app)}" oninput='S.app=this.value;save();nav()'><p class='soft'>dashboard title</p><input value="${e(S.title)}" oninput='S.title=this.value;save()'></div><div class='card'><h3>look</h3><p class='soft'>color</p><div class='row' style='flex-wrap:wrap'>${PRE.map((c,i)=>`<button class='chk' style='background:${c};width:34px;height:34px' onclick='setA(${i})'></button>`).join('')}<input type='color' value='${(S.th&&S.th.a)||'#d98fa0'}' onchange='S.th={a:this.value};save();applyTheme()' style='width:56px;height:36px;padding:2px'><button class='btn ghost' onclick='S.th={};save();applyTheme()'>reset</button></div><p class='soft'>title font</p>${sel('hf',Object.keys(FONTS))}<p class='soft'>text font</p>${sel('bf',Object.keys(FONTS))}<p class='soft'>light or dark</p>${sel('mode',['auto','light','dark'])}<p class='soft'>card style</p>${sel('cs',['dotted','solid','soft'])}</div><div class='card'><h3>pictures</h3><p class='soft'>tap any banner to change it. tap the circle on the dashboard for your sticker photo.</p><button class='btn ghost' onclick='S.cv={};S.cover="";S.avatar="";save();re()'>remove all banners and sticker</button><p class='soft'>backup (keeps text, photos and settings, not song files)</p><button class='btn ghost' onclick='bk()'>save backup file</button> <button class='btn ghost' onclick='rs()'>restore backup</button></div></div><div class='card' style='margin-top:16px'><h3>pages</h3><p class='soft'>change the icon (any emoji) and name, reorder, or hide.</p>${allK().map((k,n)=>`<div class='row'><input value="${e(lab(k)[0])}" style='width:64px' oninput='setPn(${n},0,this.value)'><input value="${e(lab(k)[1])}" oninput='setPn(${n},1,this.value)'><button class='btn ghost' onclick='mv(${n},-1)'>↑</button><button class='btn ghost' onclick='mv(${n},1)'>↓</button>${k=='custom'?'':`<label class='soft'><input type='checkbox' style='width:auto' ${S.hide[k]?'':'checked'} onchange='hd(${n})'> show</label>`}</div>`).join('')}</div></div>`;
/* habits */
let wk=0;
const wd=()=>{const m=new Date();m.setDate(m.getDate()-((m.getDay()+6)%7)+wk*7);return DAYS.map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return iso(d)})};
const streak=h=>{let d=new Date(),n=0;if(!h.days[iso(d)])d.setDate(d.getDate()-1);while(h.days[iso(d)]){n++;d.setDate(d.getDate()-1)}return n};
const hg=(id,i)=>{const h=S.habits.find(x=>x.id==id),d=i<0?T:wd()[i];if(h.days[d])delete h.days[d];else h.days[d]=1;save();re()};
const addHab=()=>{const n=val('hn');if(!n)return;S.habits.push({id:Date.now(),n,e:val('he')||'🌷',days:{}});save();re()};
P.habit=()=>{const ds=wd();return `<div class='pad'><h2>habits</h2><div class='row'><button class='btn ghost' onclick='wk--;re()'>‹</button><span class='soft'>week of ${ds[0]}</span><button class='btn ghost' onclick='wk++;re()'>›</button><button class='btn ghost' onclick='wk=0;re()'>this week</button></div><div class='card' style='overflow-x:auto'><table style='width:100%;border-collapse:collapse'><tr><td></td>${DAYS.map(d=>`<td class='soft' align='center'>${d}</td>`).join('')}<td></td></tr>${S.habits.map(h=>`<tr><td style='padding:8px 8px 8px 0;white-space:nowrap'>${e(h.e)} ${e(h.n)}<br><small class='soft'>${streak(h)} day streak</small></td>${ds.map((d,i)=>`<td align='center'><button class='chk' style='${h.days[d]?'background:var(--rose)':''}' onclick='hg(${h.id},${i})'>${h.days[d]?'✓':''}</button></td>`).join('')}<td><button class='x' onclick="rm('habits',${h.id})">×</button></td></tr>`).join('')}</table>${S.habits.length?'':'<p class="soft">add your first habit ♡</p>'}<div class='row'><input id='he' placeholder='🌷' style='width:70px'><input id='hn' placeholder='new habit (water, skincare, reading…)' onkeydown="event.key=='Enter'&&addHab()"><button class='btn' onclick='addHab()'>add</button></div></div></div>`};
/* ===== detailed week view ===== */
const WS={view:'timeline',start:1,weekend:1,h0:7,h1:22,hh:52,routine:1,agenda:1,habits:1,done:1,goals:1,dnote:1};
S.wset=Object.assign({},WS,S.wset);
let wo=0,wcfg=0,ef=null;
const pd=s=>{const[y,m,d]=s.split('-');return new Date(+y,m-1,+d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const tm=s=>{const[h,m]=(s||'0:0').split(':');return +h*60+ +m};
const hm=n=>String(n/60|0).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const dn=d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][pd(d).getDay()];
const wkS=()=>{const d=new Date();d.setDate(d.getDate()-(d.getDay()-S.wset.start+7)%7+wo*7);return iso(d)};
const wDays=()=>{const s=wkS();let a=[...Array(7)].map((_,i)=>addD(s,i));if(!+S.wset.weekend)a=a.filter(d=>{const g=pd(d).getDay();return g&&g!=6});return a};
const catOf=id=>S.cats.find(c=>c.id==id)||{e:'🌸',c:'#d98fa0',n:'other'};
const WK=()=>{const k=wkS();return S.wk[k]=S.wk[k]||{theme:'',goals:[],notes:'',days:{}}};
const dayNote=d=>((S.wk[wkS()]||{}).days||{})[d]||'';
const setDn=(d,v)=>{WK().days[d]=v;save()};
const evsOn=d=>{const o=[];S.evs.forEach(x=>{if(x.w==d||(d>x.w&&(x.rep=='daily'||(x.rep=='weekly'&&dn(x.w)==dn(d)))))o.push({...x,dt:d})});
 if(+S.wset.routine)(S.sched[dn(d)]||[]).forEach(r=>o.push({id:'r'+r.id,t:r.t,s:r.time,f:hm(tm(r.time)+60),rt:1,dt:d,c:0}));
 return o.filter(x=>+S.wset.done||!(x.dn&&x.dn[d])).sort((a,b)=>tm(a.s)-tm(b.s))};
const chip=(x,st)=>{const c=catOf(x.c),dd=x.dn&&x.dn[x.dt];
 return `<div class='ev ${dd?'d':''} ${x.rt?'rt':''}' style='--c:${c.c};${st||''}' onclick='${x.rt?'go("sched")':`openEv(${x.id},"${x.dt}")`}'>${x.rt?'':`<button class='chk' style='float:right;width:18px;height:18px;font-size:10px;background:${dd?'var(--rose)':'none'}' onclick='event.stopPropagation();tgEv(${x.id},"${x.dt}")'>${dd?'✓':''}</button>`}<b>${x.s?x.s+(x.f?'–'+x.f:'')+' ':''}</b>${c.e||''} ${e(x.t)}${x.loc?`<br><small>📍 ${e(x.loc)}</small>`:''}</div>`};
const tgEv=(id,d)=>{const v=S.evs.find(z=>z.id==id);v.dn=v.dn||{};if(v.dn[d])delete v.dn[d];else v.dn[d]=1;save();re()};
const hdr=d=>`<div class='wh ${d==T?'today':''}'><b>${dn(d)}</b> <span style='font:700 20px var(--hf)'>${pd(d).getDate()}</span>${+S.wset.dnote?`<input value="${e(dayNote(d))}" placeholder='note' style='font-size:12px;padding:3px 6px;margin-top:3px' onchange='setDn("${d}",this.value)'>`:''}<button class='x' style='display:block;margin:auto' onclick='openEv(0,"${d}")'>＋</button></div>`;
const allDay=d=>{let h='';evsOn(d).filter(x=>!x.s).forEach(x=>h+=chip(x));if(+S.wset.agenda)S.agenda.filter(a=>a.w==d&&!a.d).forEach(a=>h+=`<div class='ev' style='--c:var(--soft)' onclick='go("agenda")'>🗓 ${e(a.t)}</div>`);if(+S.wset.habits&&S.habits.length)h+=`<div class='soft' style='font-size:12px;text-align:center'>🌷 ${S.habits.filter(x=>x.days[d]).length}/${S.habits.length}</div>`;return h};
const tlView=ds=>{const W=S.wset,hh=+W.hh,h0=+W.h0,h1=+W.h1,H=(h1-h0)*hh,nw=new Date(),nm=nw.getHours()*60+nw.getMinutes();
 const lines=[...Array(h1-h0)].map((_,i)=>`<div class='hr' style='top:${i*hh}px'></div>`).join('');
 const cols=ds.map(d=>{const ev=evsOn(d).filter(x=>x.s),lanes=[];ev.forEach(x=>{const s=tm(x.s),f=Math.max(tm(x.f||hm(s+60)),s+20);x._s=s;x._f=f;let l=lanes.findIndex(z=>z<=s);if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=f;x._l=l});const n=lanes.length||1;
  return `<div class='tl' style='height:${H}px'>${lines}${d==T&&nm>=h0*60&&nm<h1*60?`<div style='position:absolute;left:0;right:0;border-top:2px solid var(--rose);top:${(nm-h0*60)/60*hh}px;z-index:2'></div>`:''}${ev.map(x=>chip(x,`top:${(x._s-h0*60)/60*hh}px;height:${Math.max((x._f-x._s)/60*hh-2,22)}px;left:${x._l/n*100}%;width:${100/n-1}%`)).join('')}</div>`});
 return `<div class='wscroll'><div style='display:grid;grid-template-columns:34px repeat(${ds.length},minmax(96px,1fr));min-width:${34+ds.length*96}px'><div></div>${ds.map(hdr).join('')}<div></div>${ds.map(d=>`<div style='padding:2px'>${allDay(d)}</div>`).join('')}<div style='position:relative;height:${H}px'>${[...Array(h1-h0)].map((_,i)=>`<div class='soft' style='position:absolute;top:${i*hh-8}px;font-size:11px'>${h0+i}</div>`).join('')}</div>${cols.join('')}</div></div>`};
const gridView=ds=>`<div class='wscroll'><div style='display:grid;grid-template-columns:repeat(${ds.length},minmax(130px,1fr));gap:8px;min-width:${ds.length*130}px'>${ds.map(d=>`<div class='card' style='padding:8px'>${hdr(d)}${allDay(d)}${evsOn(d).filter(x=>x.s).map(x=>chip(x)).join('')}</div>`).join('')}</div></div>`;
const listView=ds=>ds.map(d=>`<div class='card' style='margin-bottom:10px'><h3>${dn(d)} ${pd(d).getDate()} ${d==T?'♡':''}</h3>${allDay(d)}${evsOn(d).filter(x=>x.s).map(x=>chip(x)).join('')}<button class='btn ghost' onclick='openEv(0,"${d}")'>+ add</button></div>`).join('');
const openEv=(id,d)=>{const x=S.evs.find(v=>v.id==id);ef=x?{...x}:{id:0,w:d,s:'',f:'',c:(S.cats[0]||{}).id,loc:'',nt:'',rep:'none',t:''};re();scrollTo(0,0)};
const saveEv=()=>{const t=val('et');if(!t)return alert('give it a name ♡');const o={...ef,t,w:val('ew')||T,s:val('es'),f:val('ef'),c:val('ec'),loc:val('el'),nt:$('#en').value,rep:val('er')};delete o.dt;if(o.id){S.evs[S.evs.findIndex(v=>v.id==o.id)]=o}else{o.id=Date.now();S.evs.push(o)}ef=null;save();re()};
const delEv=()=>{S.evs=S.evs.filter(v=>v.id!=ef.id);ef=null;save();re()};
const evForm=()=>!ef?'':`<div class='card' style='margin-bottom:14px'><h3>${ef.id?'edit event':'new event'}</h3><div class='row' style='flex-wrap:wrap'><input id='et' placeholder='what’s happening?' value="${e(ef.t)}" style='flex:3;min-width:180px'><input type='date' id='ew' value='${ef.w}' style='flex:1;min-width:140px'></div><div class='row' style='flex-wrap:wrap'><label class='soft'>start <input type='time' id='es' value='${ef.s}' style='width:auto'></label><label class='soft'>end <input type='time' id='ef' value='${ef.f}' style='width:auto'></label><select id='ec' style='flex:1'>${S.cats.map(c=>`<option value='${c.id}' ${c.id==ef.c?'selected':''}>${c.e} ${e(c.n)}</option>`).join('')}</select><select id='er' style='flex:1'>${[['none','one time'],['weekly','every week'],['daily','every day']].map(([v,n])=>`<option value='${v}' ${v==ef.rep?'selected':''}>${n}</option>`).join('')}</select></div><div class='row'><input id='el' placeholder='📍 place' value="${e(ef.loc)}"></div><textarea id='en' style='min-height:70px' placeholder='notes'>${e(ef.nt)}</textarea><div class='row'><button class='btn' onclick='saveEv()'>save</button><button class='btn ghost' onclick='ef=null;re()'>cancel</button>${ef.id?`<button class='btn ghost' onclick='delEv()'>delete</button>`:''}</div><p class='soft'>leave the start time empty for an all-day item. repeating events change everywhere when edited.</p></div>`;
const wset=(k,v)=>{S.wset[k]=v;save();re()};
const chkb=(k,l)=>`<label class='row soft'><input type='checkbox' style='width:auto' ${+S.wset[k]?'checked':''} onchange='wset("${k}",this.checked?1:0)'> ${l}</label>`;
const opt=(k,l,o)=>`<label class='soft'>${l}<select onchange='wset("${k}",this.value)'>${o.map(([v,n])=>`<option value='${v}' ${S.wset[k]==v?'selected':''}>${n}</option>`).join('')}</select></label>`;
const cset=(id,k,v)=>{S.cats.find(c=>c.id==id)[k]=v;save();re()};
const cdel=id=>{S.cats=S.cats.filter(c=>c.id!=id);save();re()};
const cadd=()=>{S.cats.push({id:Date.now(),n:'new category',e:'🌸',c:'#d98fa0'});save();re()};
const catRow=c=>`<div class='row'><input value="${e(c.e)}" style='width:60px' onchange='cset(${c.id},"e",this.value)'><input value="${e(c.n)}" onchange='cset(${c.id},"n",this.value)'><input type='color' value='${c.c}' style='width:54px;height:38px;padding:2px' onchange='cset(${c.id},"c",this.value)'><button class='x' onclick='cdel(${c.id})'>×</button></div>`;
const panel=()=>{const W=S.wset;return `<div class='card' style='margin-bottom:14px'><h3>customize this view</h3><div class='grid' style='gap:10px'>${opt('view','view',[['timeline','timeline'],['grid','day columns'],['list','list']])}${opt('start','week starts',[[1,'Monday'],[0,'Sunday']])}<label class='soft'>first hour<input type='number' min='0' max='22' value='${W.h0}' onchange='wset("h0",Math.min(+this.value,S.wset.h1-1))'></label><label class='soft'>last hour<input type='number' min='1' max='24' value='${W.h1}' onchange='wset("h1",Math.max(+this.value,S.wset.h0+1))'></label><label class='soft'>row height<input type='range' min='30' max='110' value='${W.hh}' onchange='wset("hh",+this.value)'></label></div>${chkb('weekend','show weekends')}${chkb('routine','show my weekly routine')}${chkb('agenda','show agenda items')}${chkb('habits','show habit counts')}${chkb('done','show finished events')}${chkb('goals','show weekly goals')}${chkb('dnote','show a note line for each day')}<h3 style='margin-top:12px'>categories and colors</h3>${S.cats.map(catRow).join('')}<button class='btn ghost' onclick='cadd()'>+ category</button></div>`};
const gAdd=()=>{const t=val('gt');if(!t)return;WK().goals.push({id:Date.now(),t,d:0});save();re()};
const gTg=id=>{const g=WK().goals.find(x=>x.id==id);g.d=!g.d;save();re()};
const gRm=id=>{const w=WK();w.goals=w.goals.filter(x=>x.id!=id);save();re()};
P.week=()=>{const ds=wDays(),W=S.wset,w0=WK(),a=ds[0],b=ds[ds.length-1],fm=d=>pd(d).toLocaleDateString('en',{month:'short',day:'numeric'}),all=ds.flatMap(d=>evsOn(d).filter(x=>!x.rt)),dnn=all.filter(x=>x.dn&&x.dn[x.dt]).length,hb=ds.reduce((n,d)=>n+S.habits.filter(h=>h.days[d]).length,0);
 return `<div class='pad'><h2>my week</h2><div class='row' style='flex-wrap:wrap'><button class='btn ghost' onclick='wo--;re()'>‹</button><b style='font:700 24px var(--hf)'>${fm(a)} – ${fm(b)}</b><button class='btn ghost' onclick='wo++;re()'>›</button><button class='btn ghost' onclick='wo=0;re()'>today</button><span style='flex:1'></span><button class='btn' onclick='openEv(0,"${T>=a&&T<=b?T:a}")'>+ event</button><button class='btn ghost' onclick='wcfg=!wcfg;re()'>⚙ customize</button></div><input value="${e(w0.theme)}" placeholder='this week’s theme ✿ (soft and slow, exam week…)' oninput='WK().theme=this.value;save()' style='font:italic 500 22px var(--hf);margin-bottom:10px'>${wcfg?panel():''}${evForm()}${W.view=='grid'?gridView(ds):W.view=='list'?listView(ds):tlView(ds)}<div class='grid' style='margin-top:16px'>${+W.goals?`<div class='card'><h3>weekly goals</h3>${w0.goals.map(g=>`<div class='item ${g.d?'d':''}'><button class='chk' onclick='gTg(${g.id})'>${g.d?'✓':''}</button><span>${e(g.t)}</span><button class='x' onclick='gRm(${g.id})'>×</button></div>`).join('')}<div class='row'><input id='gt' placeholder='add a goal' onkeydown="event.key=='Enter'&&gAdd()"><button class='btn' onclick='gAdd()'>+</button></div></div>`:''}<div class='card'><h3>week notes</h3><textarea oninput='WK().notes=this.value;save()' placeholder='reminders, reflections…'>${e(w0.notes)}</textarea></div><div class='card'><h3>this week</h3><p>events: ${all.length}<br>finished: ${dnn}<br>habit check-ins: ${hb}</p></div></div></div>`};
